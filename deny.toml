# Rust-Toolchain dependency policy, reviewed for Rustphin on 2026-10-12.
# Rustphin is GPL-3.0-or-later (decision D-003): every licence allowed here
# must be compatible with GPLv3.
# See https://embarkstudios.github.io/cargo-deny/ for full options.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

[advisories]
yanked = "deny"
# Informational lifecycle notices, not vulnerability exceptions. The zbus 5
# stack backs our UDisks2, FileManager1 and instance services; these crates
# were merged into zbus 6. Re-check at the next zbus upgrade. (The notices
# the GPUI toolkit brought in went with it in W-114i.)
ignore = [
    # Approved by the maintainer on 2026-10-18: upstream merged these
    # standalone crates into zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: retained by our zbus 5 integrations; review at zbus upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: retained by our zbus 5 integrations; review at zbus upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: retained through zvariant in zbus 5; review at zbus upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Present in dependency trees; all GPLv3-compatible.
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    # Rustphin's own crates.
    "GPL-3.0-or-later",
]
unused-allowed-license = "allow"
confidence-threshold = 0.8
# LLVM's libFuzzer runtime is used only by the separate fuzz workspace.
# Its NCSA terms are permissive BSD-style terms compatible with GPLv3.
# libbz2-rs-sys, the pure-Rust bzip2 used for ZIP, TAR.BZ2 and 7Z archives
# (W-111, D-032), keeps bzip2's own licence (bzip2-1.0.6): permissive
# zlib/BSD-style terms, compatible with GPLv3. Allowed for that crate only.
exceptions = [
    { name = "libfuzzer-sys", allow = ["NCSA"] },
    { name = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path and are never published.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# The GPUI toolkit was replaced by Qt (W-114i, D-034): it must not return
# by way of a dependency.
deny = [
    { crate = "gpui-kit" },
    { crate = "gpui-pre" },
    # Privacy (R-108, decision D-018): Rustphin makes no network connections
    # of its own. Any HTTP client, TLS stack or telemetry crate fails the
    # gate and needs a new decision.
    { crate = "async-net" },
    { crate = "http" },
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "surf" },
    { crate = "attohttpc" },
    { crate = "rustls" },
    { crate = "native-tls" },
    { crate = "openssl" },
    { crate = "sentry" },
    { crate = "opentelemetry" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
