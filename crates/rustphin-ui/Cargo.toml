[package]
name = "rustphin-ui"
description = "GPUI user interface of Rustphin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Use the pinned toolkit's frame profiler for R-101 measurements.
# Its optional hdrhistogram is MIT/Apache-2.0, both allowed by deny.toml.
diagnostics = ["gpui-kit/profiler"]

[dependencies]
rustphin-core.workspace = true
rustphin-platform.workspace = true
gpui-kit.workspace = true
flume.workspace = true
jiff.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
