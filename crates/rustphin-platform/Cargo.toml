[package]
name = "rustphin-platform"
description = "Desktop integration for Rustphin: Wayland, D-Bus and XDG services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
# This crate is the only place allowed to use `unsafe` (see AGENTS.md).
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
flume.workspace = true
fontconfig-parser.workspace = true
fontdb.workspace = true
image.workspace = true
md-5.workspace = true
png.workspace = true
jiff.workspace = true
rustix = { workspace = true, features = ["process", "fs", "net", "event", "thread"] }
rustphin-core.workspace = true
raw-window-handle.workspace = true
roxmltree.workspace = true
thiserror.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wl-clipboard-rs.workspace = true
zbus.workspace = true

[dev-dependencies]
# The mock device service talks to the client without a bus daemon.
zbus = { workspace = true, features = ["p2p"] }
rustphin-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# In-process protocol fixture only; MIT, GPLv3-compatible, absent from app builds.
wayland-server = "=0.31.14"
wayland-protocols = { workspace = true, features = ["server"] }
