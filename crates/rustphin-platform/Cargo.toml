[package]
name = "rustphin-platform"
description = "Desktop integration for Rustphin: Wayland, D-Bus and XDG services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
# This crate is the only place allowed to use `unsafe` (see AGENTS.md).
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
flume.workspace = true
image.workspace = true
md-5.workspace = true
png.workspace = true
jiff.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["process", "fs", "net", "event", "thread"] }
rustphin-core.workspace = true
roxmltree.workspace = true
thiserror.workspace = true
wl-clipboard-rs.workspace = true
zbus.workspace = true

[dev-dependencies]
# The mock device service talks to the client without a bus daemon.
zbus = { workspace = true, features = ["p2p"] }
rustphin-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true


# Its sandbox guard has unit tests; run them with the crate's own.
[[example]]
name = "fake_admin_helper"
test = true
