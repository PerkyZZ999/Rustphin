[package]
name = "rustphin"
description = "Rustphin, a file manager for KDE Plasma on Wayland, with a Qt 6 and QML interface (D-034)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The code cxx-qt generates calls cxx's own macros, which cargo-shear cannot
# see in the sources.
[package.metadata.cargo-shear]
ignored = ["cxx"]

[dependencies]
rustphin-core.workspace = true
rustphin-view.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
flume.workspace = true
jiff.workspace = true
rustphin-platform.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true
qt-build-utils.workspace = true
