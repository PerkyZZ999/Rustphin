[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
rustphin-core = { path = "crates/rustphin-core" }
rustphin-platform = { path = "crates/rustphin-platform" }
rustphin-ui = { path = "crates/rustphin-ui" }

jiff = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
flume = { version = "0.11", default-features = false, features = ["async"] }
notify = { version = "8", default-features = false }
rayon = "1"
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
rustix = { version = "1", features = ["fs"] }
wl-clipboard-rs = "0.9"
roxmltree = "0.21"
zbus = "5"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
md-5 = "0.10"
# Font pre-read (W-109b): the versions and file reading GPUI's text system
# uses (cosmic-text 0.19), so the same parts of each font are read. MIT.
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }
fontconfig-parser = "0.5"
# Compress and extract (W-111, D-032), in the core's operation engine.
# Licences checked 2026-11-13: zip MIT; tar, flate2, bzip2 MIT or Apache-2.0;
# lzma-rust2 and sevenz-rust2 Apache-2.0; zstd BSD-3-Clause. Codecs chosen
# explicitly: Deflate, Deflate64, BZip2, LZMA/XZ, Zstd, and AES for
# encrypted archives.
zip = { version = "9.5", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "xz", "zstd"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
zstd = "0.14"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "zstd", "util"] }
png = "0.18"

# UI toolkit, pinned exactly (decision D-001). Upgrade only as a planned work item.
gpui-kit = "=0.7.3"
# gpui-kit's Linux text system, used directly only by tests of the bundled
# fonts. Pinned to the version gpui-kit 0.7.3 uses.
gpui-pre-wgpu = "=0.3.9"

# Direct Wayland access for the platform layer; versions match gpui-pre 0.3.9's lockfile.
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Optimise dependencies in debug builds: the toolkit's text shaping and
# font matching are many times slower unoptimised, which made debug
# windows take seconds to appear. Workspace crates stay unoptimised for
# fast rebuilds and full debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
