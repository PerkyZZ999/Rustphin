[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
rustphin-core = { path = "crates/rustphin-core" }
rustphin-platform = { path = "crates/rustphin-platform" }
rustphin-view = { path = "crates/rustphin-view" }

jiff = "0.2"
serde = { version = "1", features = ["derive"] }
# Structured data handed to QML as JSON (W-114f). MIT or Apache-2.0.
serde_json = "1"
toml = "0.9"
flume = { version = "0.11", default-features = false, features = ["async"] }
notify = { version = "8", default-features = false }
rayon = "1"
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
rustix = { version = "1", features = ["fs"] }
# The allocator's arena limit (W-115); MIT or Apache-2.0.
libc = "0.2"
wl-clipboard-rs = "0.9"
roxmltree = "0.21"
zbus = "5"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
md-5 = "0.10"
# Properties › Checksums (W-170, D-041): RustCrypto, MIT or Apache-2.0,
# on the same digest 0.10 line as md-5.
sha1 = "0.10"
sha2 = "0.10"
# Compress and extract (W-111, D-032), in the core's operation engine.
# Licences checked 2026-11-13: zip MIT; tar, flate2, bzip2 MIT or Apache-2.0;
# lzma-rust2 and sevenz-rust2 Apache-2.0; zstd BSD-3-Clause. Codecs chosen
# explicitly: Deflate, Deflate64, BZip2, LZMA/XZ, Zstd, and AES for
# encrypted archives.
zip = { version = "9.5", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "xz", "zstd"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
zstd = "0.14"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "zstd", "util"] }
png = "0.18"

# The Qt 6 interface (W-114, D-034). cxx and cxx-qt are MIT or Apache-2.0;
# Qt itself is linked from the system under LGPL-3.0.
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
qt-build-utils = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Optimise dependencies in debug builds: image decoding, archive codecs and
# the cxx-qt glue are many times slower unoptimised. Workspace crates stay
# unoptimised for fast rebuilds and full debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
